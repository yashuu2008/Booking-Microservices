version: '3.9'

services:

  # Infrastructure
  mysql:
    image: mysql:8.0
    container_name: booking_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: booking_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Notification Service (no DB dependency - starts first)
  notification-service:
    build: ./NotificationService
    container_name: notification_service
    restart: always
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_USER: your_email@example.com
      MAIL_PASS: your_email_password
    depends_on:
      redis:
        condition: service_healthy

  # Hotel Service
  hotel-service:
    build: ./HotelService
    container_name: hotel_service
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: airbnb_hotel
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROOM_CRON: "0 2 * * *"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Booking Service
  booking-service:
    build: ./BookingService
    container_name: booking_service
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: mysql://root:root@mysql:3306/airbnb_booking
      REDIS_SERVER_URL: redis://redis:6379
      LOCK_TTL: 5000
      HOTEL_SERVICE_URL: http://hotel-service:3000/api/v1/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      hotel-service:
        condition: service_started

  # Auth Gateway (Go)
  auth-gateway:
    build: ./AuthInGo
    container_name: auth_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: ":8080"
      DBName: auth_dev
      DB_ADDR: mysql:3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NET: tcp
      JWT_SECRET: auth_in_go_secret
      HOTEL_SERVICE_URL: http://hotel-service:3000
      BOOKING_SERVICE_URL: http://booking-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
    depends_on:
      mysql:
        condition: service_healthy
      hotel-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  mysql_data:
